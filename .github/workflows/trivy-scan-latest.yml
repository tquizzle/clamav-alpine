name: Trivy Container Image Scan - Latest

on:
    push:
#      branches: [ "master" ]
      paths-ignore:
        - './mkdocs.yml'
        - './secrover/**'
        - './.github/**'
        - './Dockerfile'
        - './README.md'
        - './LICENSE'
        - './CODE_OF_CONDUCT.md'
        - './CONTRIBUTING.md'
        - './SECURITY.md'
        - './CHANGELOG.md'
        - './edge-Dockerfile'
        - './.dockerignore'
        - './img/**'
        - './docs/**'
    pull_request:
      branches: [ "master" ]
      paths-ignore:
        - './mkdocs.yml'
        - './docs/**'
    workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

## Build and scan Latest image
      - name: Build an image from Dockerfile - latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_USERNAME }}/clamav-alpine:${{ github.sha }} 

      - name: Run Trivy vulnerability scanner - latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'docker.io/${{ secrets.DOCKER_USERNAME }}/clamav-alpine:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

## Upload to Security tab
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
