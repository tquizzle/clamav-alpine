name: MkDocs Deploy
on:
  # push:
  #   paths: #Target only MkDocs config
  #     - './mkdocs.yml'
  #     - './docs/**'
  #   branches:
  #   - master
  # pull_request: #Target only MkDocs folder for content
  #   paths:
  #     - './mkdocs.yml'
  #     - './docs/**'
  # workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: 3.15.2
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
    - name: Pull latest changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git config advice.mergeConflict false
        git pull origin master
    - name: Build and Commit
      uses: iSOLveIT/mkdocs-notes@main
      with:
        config_file_path: mkdocs.yml
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
#        target-branch: gh-pages
